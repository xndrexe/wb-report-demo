[project]
name = "wb-report-demo"
version = "0.1.0"
description = "Отчёт по продажам, остаткам и рекламе Wildberries и Ozon в Google Таблице или Excel"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
